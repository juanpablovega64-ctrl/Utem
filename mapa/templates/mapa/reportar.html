<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportar Barrera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-danger text-white">
                        <h2 class="h5 mb-0">⚠️ Reportar un Problema de Accesibilidad</h2>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %} {{ form.as_p }} <button type="submit" class="btn btn-primary w-100 mb-2">Enviar Reporte</button>
                            <a href="{% url 'inicio' %}" class="btn btn-outline-secondary w-100">Cancelar y Volver al Mapa</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
